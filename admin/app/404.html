<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Page not found · Kivie Platform Admin</title>
<script>(function(){var q=(location.search.match(/[?&]theme=(light|dark)/)||[])[1];var t=q;if(!t){try{t=localStorage.getItem("kivie-admin-theme");}catch(e){}}if(t!=="light"&&t!=="dark")t="light";try{localStorage.setItem("kivie-admin-theme",t);}catch(e){}document.documentElement.setAttribute("data-theme",t);})();</script>
<link rel="stylesheet" href="../css/tokens.css">
<link rel="stylesheet" href="../css/base.css">
<link rel="stylesheet" href="../css/components.css">
</head>
<body data-page="" data-title="Not found">
<div class="app" data-shell>
  <div class="main">
    <header class="topbar" data-topbar></header>
    <main class="content">
      <div class="content__inner">
        <div class="errpage rise rise-1">
          <div class="errpage__code num">404</div>
          <h1 class="errpage__title">We could not find that page</h1>
          <p class="errpage__body">The link may be out of date, or the record may have been reassigned or removed. No data has been lost.</p>
          <div class="errpage__acts">
            <a class="btn btn--primary" href="overview.html">Back to Overview</a>
            <a class="btn btn--ghost" href="hipaa-audit.html">Open audit log</a>
          </div>
          <p class="t-meta mt-5">If you reached this from inside Kivie, the navigation attempt was logged.</p>
        </div>
      </div>
    </main>
  </div>
</div>
<script src="../js/app.js"></script>
</body>
</html>
