<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Checked in · Kivie</title>
  <meta name="theme-color" content="#F4F7F3">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/tokens.css">
  <link rel="stylesheet" href="../css/base.css">
  <link rel="stylesheet" href="../css/components.css">
  <script>(function(){var q=(location.search.match(/[?&]companion=(plant|cat)/)||[])[1];var c=q;if(!c){try{c=localStorage.getItem("kivie-companion");}catch(e){}}if(c!=="plant"&&c!=="cat")c="plant";try{localStorage.setItem("kivie-companion",c);}catch(e){}document.documentElement.setAttribute("data-companion",c);})();</script>
  <link rel="manifest" href="../manifest.json">
  <link rel="apple-touch-icon" href="../assets/icons/apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="32x32" href="../assets/icons/favicon-32.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Kivie">
</head>
<!-- Full-screen celebration overlay (above the tab bar). Sound OFF by default.
     A normal daily check-in gets the CALM confirmation; real celebration is
     reserved for milestones (7/14/30/60/90 + pain improvement) so it feels
     earned. Deep-link ?milestone=14 (or the preview button) shows the full show. -->
<body>
  <div class="app">

    <!-- ============ Calm daily confirmation (default) ============ -->
    <section class="celebrate" id="calmView" aria-label="Checked in">
      <!-- R3 review: a small, dignified celebration for the ordinary day —
           a light petal drift and the points ticking up. The full show
           (petals + companion growth + medal reveal) stays reserved for
           milestones so it still feels earned. -->
      <div class="bloom" id="bloomCalm" aria-hidden="true"></div>

      <span class="calmcheck pop">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M4.5 12.5 9.5 17.5 19.5 6.5"/></svg>
      </span>

      <div>
        <h1 class="t-h1">Checked in for today</h1>
        <p class="t-body-lg t-muted">Your doctor can see your update.</p>
      </div>

      <div class="plantscene">
        <img class="celebrate__smallplant" src="../assets/art/plant-1-young.svg" data-companion-art="1" alt="Your companion" width="96" height="96">
      </div>

      <span class="tickpoints">
        <span class="tickpoints__plus">+</span>
        <span class="tickpoints__num" data-count-to="10">0</span>
        <span class="t-caption" style="align-self:center;">progress points</span>
      </span>

      <p class="t-body t-muted">Come back tomorrow. Next reminder at <strong>9:00 AM</strong>.</p>

      <a class="btn btn--primary" href="today.html" style="max-width:320px;">Done</a>

      <!-- Prototype helper: preview the milestone celebration -->
      <button type="button" class="btn btn--ghost" id="previewMilestone" style="max-width:320px; min-height:var(--tap-min);">Preview a milestone celebration</button>
    </section>

    <!-- ============ Milestone celebration (the full show) ============ -->
    <section class="celebrate" id="milestoneView" aria-label="Milestone reached" hidden>
      <!-- soft bloom of petals drifting up (generated by JS) -->
      <div class="bloom" id="bloom" aria-hidden="true"></div>

      <!-- The page sits blurred behind the badge flight, then clears. -->
      <div class="mspage" data-ms-page>

        <!-- reduced-motion path: no flight, so the medal is shown in place -->
        <span class="medalreveal" data-ms-static hidden>
          <img src="../assets/art/badge-gold-plant.svg" data-companion-medal="gold" alt="Two Weeks Strong — Gold medallion" width="128" height="128">
        </span>

        <!-- the companion grows one stage -->
        <div class="grow" id="grow">
          <img class="grow__img grow__img--from" src="../assets/art/plant-1-young.svg" data-companion-art="1" alt="" aria-hidden="true" width="168" height="168">
          <img class="grow__img grow__img--to" src="../assets/art/plant-2-mature.svg" data-companion-art="2" alt="Your companion has grown" width="168" height="168">
        </div>

        <div>
          <p class="milestone-name">Two Weeks Strong</p>
          <h1 class="t-h1" style="margin-top:var(--sp-1);">Your <span data-companion-word>plant</span> is growing</h1>
          <p class="t-body-lg t-muted" style="margin-top:var(--sp-2);">Fourteen days of care. Your doctor can see your update.</p>
        </div>

        <span class="tickpoints">
          <span class="tickpoints__plus">+</span>
          <span class="tickpoints__num" data-count-to="25">0</span>
          <span class="t-caption" style="align-self:center;">progress points</span>
        </span>

        <a class="btn btn--primary" href="today.html" style="max-width:320px;">Done</a>
      </div>

      <!-- Badge flight: rises from below, holds large at centre while the
           page is blurred behind it, then lifts away. Presentational only —
           the badge is named in the text, so this is aria-hidden. -->
      <div class="badgeflight" data-ms-flight aria-hidden="true">
        <img class="badgeflight__img" src="../assets/art/badge-gold-plant.svg" data-companion-medal="gold" alt="">
      </div>
    </section>

  </div>

  <script src="../js/app.js"></script>
  <script>
    (function () {
      var reduce = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
      var calmView = document.getElementById("calmView");
      var milestoneView = document.getElementById("milestoneView");

      /* Soft chime — intentionally OFF by default (Section: sound off).
         Kept here as the optional hook; not invoked. */
      function softChime() {
        try {
          var Ctx = window.AudioContext || window.webkitAudioContext;
          if (!Ctx) return;
          var ctx = new Ctx(), o = ctx.createOscillator(), g = ctx.createGain();
          o.type = "sine"; o.frequency.value = 528;
          o.connect(g); g.connect(ctx.destination);
          g.gain.setValueAtTime(0.0001, ctx.currentTime);
          g.gain.exponentialRampToValueAtTime(0.04, ctx.currentTime + 0.06);
          g.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + 0.9);
          o.start(); o.stop(ctx.currentTime + 0.95);
        } catch (e) {}
      }

      function countUp(el) {
        if (!el) return;
        var target = parseInt(el.getAttribute("data-count-to"), 10);
        if (reduce) { el.textContent = target; return; }
        var dur = 1000, start = null;
        var ease = function (t) { return 1 - Math.pow(1 - t, 3); };
        (function step(ts) {
          if (start === null) start = ts;
          var p = Math.min((ts - start) / dur, 1);
          el.textContent = Math.round(ease(p) * target);
          if (p < 1) requestAnimationFrame(step);
        })(performance.now());
      }

      function dropPetals(layerId, count) {
        if (reduce) return;
        var layer = document.getElementById(layerId || "bloom");
        if (!layer) return;
        var n = count || 16;
        var colors = ["var(--c-accent)", "var(--c-celebrate)", "#43B18E", "#F0A98C"];
        for (var i = 0; i < n; i++) {
          var p = document.createElement("i");
          p.className = "petal";
          p.style.left = (4 + Math.round((i / n) * 92) + (i % 3) * 3) + "%";
          p.style.background = colors[i % colors.length];
          p.style.setProperty("--spin", (90 + (i % 5) * 40) + "deg");
          p.style.animationDelay = ((i % 6) * 0.22).toFixed(2) + "s";
          var s = 12 + (i % 4) * 4;
          p.style.width = s + "px"; p.style.height = s + "px";
          layer.appendChild(p);
        }
      }

      /* The everyday celebration — deliberately lighter than a milestone:
         half the petals, no companion growth, no medal. */
      function runCalm() {
        dropPetals("bloomCalm", 8);
        countUp(calmView.querySelector("[data-count-to]"));
      }

      /* The milestone show, in two phases:
           1. the badge rises from below and holds large, page blurred behind
           2. it lifts away; the page resolves and the companion grows

         Timings come from the CSS custom properties on #milestoneView so the
         script and the keyframes cannot drift apart. */
      function ms(el, prop, fallback) {
        var v = getComputedStyle(el).getPropertyValue(prop).trim();
        var n = parseFloat(v);
        if (!v || isNaN(n)) return fallback;
        return /ms$/.test(v) ? n : n * 1000;   /* accepts 520ms or 0.52s */
      }

      function runMilestone() {
        var page   = milestoneView.querySelector("[data-ms-page]");
        var flight = milestoneView.querySelector("[data-ms-flight]");
        var stat   = milestoneView.querySelector("[data-ms-static]");
        var grow   = document.getElementById("grow");
        var points = milestoneView.querySelector("[data-count-to]");

        if (reduce) {
          /* no flight — show the badge in place and settle everything */
          if (flight) flight.remove();
          if (stat) stat.hidden = false;
          page.classList.add("is-clear");
          grow.classList.add("is-grown");
          countUp(points);
          return;
        }

        var rise = ms(milestoneView, "--ms-rise", 520);
        var hold = ms(milestoneView, "--ms-hold", 1000);
        var exit = ms(milestoneView, "--ms-exit", 460);

        /* petals ride along with the badge's arrival, not before it */
        setTimeout(function () { dropPetals("bloom", 16); }, rise * 0.6);

        /* the page clears as the badge starts to leave, so the two motions
           overlap rather than queueing — it reads as one gesture */
        setTimeout(function () {
          page.classList.add("is-clear");
          grow.classList.add("is-grown");
          countUp(points);
        }, rise + hold);

        /* tidy up once the badge is gone */
        setTimeout(function () {
          if (flight) flight.remove();
        }, rise + hold + exit);

        /* softChime();  // stays OFF by default */
      }

      function showMilestone() {
        calmView.hidden = true;
        milestoneView.hidden = false;
        window.scrollTo(0, 0);
        runMilestone();
      }

      /* Deep-link: ?milestone=... shows the full show straight away. */
      if (/[?&]milestone=/.test(window.location.search)) {
        showMilestone();
      } else {
        runCalm();
      }
      document.getElementById("previewMilestone").addEventListener("click", showMilestone);
    })();
  </script>
<script>
  /* S16 — register the service worker so the app is genuinely installable
     (FSD §5.2, M1 §4). Silently ignored on browsers without support. */
  if ("serviceWorker" in navigator) {
    window.addEventListener("load", function () {
      navigator.serviceWorker.register("../sw.js", { scope: "../" }).catch(function () {});
    });
  }
</script>
</body>
</html>
