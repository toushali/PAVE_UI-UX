<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign in again · Kivie</title>
  <meta name="theme-color" content="#F4F7F3">
  <link rel="stylesheet" href="../css/tokens.css">
  <link rel="stylesheet" href="../css/base.css">
  <link rel="stylesheet" href="../css/components.css">
  <script>(function(){var q=(location.search.match(/[?&]companion=(plant|cat)/)||[])[1];var c=q;if(!c){try{c=localStorage.getItem("kivie-companion");}catch(e){}}if(c!=="plant"&&c!=="cat")c="plant";try{localStorage.setItem("kivie-companion",c);}catch(e){}document.documentElement.setAttribute("data-companion",c);})();</script>
  <link rel="manifest" href="../manifest.json">
  <link rel="apple-touch-icon" href="../assets/icons/apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="32x32" href="../assets/icons/favicon-32.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Kivie">
</head>
<!-- Friendly re-auth (Section 6.14). Never a scary error tone. -->
<body>
  <div class="app">
    <main class="content">
      <div class="authwrap">

        <div class="plantscene rise rise-1" aria-hidden="true">
          <img src="../assets/art/plant-1-young.svg" data-companion-art="1" alt="" width="104" height="104">
        </div>

        <div class="rise rise-2">
          <h1 class="t-h1">Let's get you back in</h1>
          <p class="tagline" style="margin-top:var(--sp-2);">For your privacy, we signed you out. Your <span data-companion-word>plant</span> is right where you left it — enter your email or phone and we'll send a fresh link.</p>
        </div>

        <div class="rise rise-2" style="display:flex; flex-direction:column; gap:var(--sp-4);">
          <input class="bigfield" type="text" inputmode="email" placeholder="Email or phone number" aria-label="Email or phone number">
          <a class="btn btn--primary" href="verify.html">Send my link</a>
        </div>

        <p class="rise rise-3" style="margin:0;">
          <span class="reassure">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg>
            No password to remember, ever.
          </span>
        </p>

      </div>
    </main>
  </div>
  <script src="../js/app.js"></script>
<script>
  /* S16 — register the service worker so the app is genuinely installable
     (FSD §5.2, M1 §4). Silently ignored on browsers without support. */
  if ("serviceWorker" in navigator) {
    window.addEventListener("load", function () {
      navigator.serviceWorker.register("../sw.js", { scope: "../" }).catch(function () {});
    });
  }
</script>
</body>
</html>
