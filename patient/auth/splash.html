<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Kivie</title>
  <meta name="theme-color" content="#F4F7F3">
  <link rel="stylesheet" href="../css/tokens.css">
  <link rel="stylesheet" href="../css/base.css">
  <link rel="stylesheet" href="../css/components.css">
  <script>(function(){var q=(location.search.match(/[?&]companion=(plant|cat)/)||[])[1];var c=q;if(!c){try{c=localStorage.getItem("kivie-companion");}catch(e){}}if(c!=="plant"&&c!=="cat")c="plant";try{localStorage.setItem("kivie-companion",c);}catch(e){}document.documentElement.setAttribute("data-companion",c);})();</script>
  <link rel="manifest" href="../manifest.json">
  <link rel="apple-touch-icon" href="../assets/icons/apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="32x32" href="../assets/icons/favicon-32.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Kivie">
</head>
<body>
  <div class="app">
    <main class="content">
      <div class="authwrap">

        <!-- Living brand mark: a translucent garden bubble with the plant
             cycling seedling -> mature -> flowering, softly swaying. -->
        <div class="rise rise-1">
          <div class="brandplant" aria-hidden="true">
            <span class="brandplant__bubble"><i class="mote"></i><i class="mote"></i><i class="mote"></i><i class="mote"></i></span>
            <span class="brandplant__stack">
              <img class="brandplant__img" src="../assets/art/plant-1-young.svg" data-companion-art="1" alt="" width="132" height="132">
              <img class="brandplant__img" src="../assets/art/plant-2-mature.svg" data-companion-art="2" alt="" width="132" height="132">
              <img class="brandplant__img" src="../assets/art/plant-3-flowering.svg" data-companion-art="3" alt="" width="132" height="132">
            </span>
          </div>
          <img class="brandlogo" src="../assets/logo.svg" alt="Kivie" style="display:block;width:118px;height:auto;margin:var(--sp-4) auto 0;">
          <p class="brandtag" style="margin-top:var(--sp-3);">Healthcare. Simplified.</p>
        </div>

        <!-- Add-to-Home-Screen coaching -->
        <section class="card rise rise-2" aria-label="Install Kivie">
          <h2 class="card__title">Add Kivie to your home screen</h2>

          <!-- platform toggle -->
          <div class="segmented" data-segmented role="group" aria-label="Choose your phone" style="margin-bottom:var(--sp-4);">
            <button type="button" class="seg is-active" data-seg data-seg-target="ios" aria-pressed="true">iPhone</button>
            <button type="button" class="seg" data-seg data-seg-target="android" aria-pressed="false">Android</button>
          </div>

          <div class="installsteps" data-seg-panel="ios">
            <div class="installstep"><span class="installstep__n">1</span><span>Tap the <strong>Share</strong> button in your browser.</span></div>
            <div class="installstep"><span class="installstep__n">2</span><span>Choose <strong>Add to Home Screen</strong>.</span></div>
            <div class="installstep"><span class="installstep__n">3</span><span>Tap <strong>Add</strong>. Kivie lives on your home screen.</span></div>
          </div>
          <div class="installsteps" data-seg-panel="android" hidden>
            <div class="installstep"><span class="installstep__n">1</span><span>Tap the <strong>⋮ menu</strong> in your browser.</span></div>
            <div class="installstep"><span class="installstep__n">2</span><span>Choose <strong>Install app</strong> or <strong>Add to Home screen</strong>.</span></div>
            <div class="installstep"><span class="installstep__n">3</span><span>Tap <strong>Install</strong>. Kivie lives on your home screen.</span></div>
          </div>
        </section>

        <a class="btn btn--primary rise rise-3" href="login.html">Continue</a>

      </div>
    </main>
  </div>
  <script src="../js/app.js"></script>
<script>
  /* S16 — register the service worker so the app is genuinely installable
     (FSD §5.2, M1 §4). Silently ignored on browsers without support. */
  if ("serviceWorker" in navigator) {
    window.addEventListener("load", function () {
      navigator.serviceWorker.register("../sw.js", { scope: "../" }).catch(function () {});
    });
  }
</script>
</body>
</html>
