<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Welcome · Kivie</title>
  <meta name="theme-color" content="#F4F7F3">
  <link rel="stylesheet" href="../css/tokens.css">
  <link rel="stylesheet" href="../css/base.css">
  <link rel="stylesheet" href="../css/components.css">
  <script>(function(){var q=(location.search.match(/[?&]companion=(plant|cat)/)||[])[1];var c=q;if(!c){try{c=localStorage.getItem("kivie-companion");}catch(e){}}if(c!=="plant"&&c!=="cat")c="plant";try{localStorage.setItem("kivie-companion",c);}catch(e){}document.documentElement.setAttribute("data-companion",c);})();</script>
  <link rel="manifest" href="../manifest.json">
  <link rel="apple-touch-icon" href="../assets/icons/apple-touch-icon.png">
  <link rel="icon" type="image/svg+xml" href="../assets/icons/favicon.svg">
  <link rel="icon" type="image/png" sizes="32x32" href="../assets/icons/favicon-32.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Kivie">
</head>
<body>
  <div class="app">
    <header class="topbar">
      <span class="topbar__title">Welcome</span>
    </header>

    <main class="content">

      <!-- 1) Trust card -->
      <section class="trustcard rise rise-1" aria-label="Your physician">
        <span class="trustcard__avatar">
          <span class="trustcard__photo">
            <svg viewBox="0 0 72 72" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><rect width="72" height="72" fill="#E5EEEA"/><circle cx="36" cy="28" r="13" fill="#0E4A44"/><path d="M12 68c0-13 11-21 24-21s24 8 24 21" fill="#0E4A44"/><path d="M30 41v6c0 3 2.7 5 6 5s6-2 6-5v-6" stroke="#0A3A35" stroke-width="2"/></svg>
          </span>
          <span class="trustcard__verified" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5 10 17.5 19 7.5"/></svg>
          </span>
        </span>
        <div>
          <div class="t-body-lg" style="font-weight:var(--fw-bold);">Your recovery plan from</div>
          <div class="t-h2">Dr. Stillman</div>
        </div>
      </section>

      <!-- R1) Confirm identity — the first and only question on the screen.
           Everything below stays hidden until this is answered. -->
      <section class="card rise rise-2" id="confirmCard" aria-label="Confirm your details">
        <h2 class="card__title">Is this you?</h2>
        <p class="t-body-lg" style="margin-bottom:var(--sp-1);"><strong>John Carter</strong></p>
        <p class="t-body t-muted confirm__contact">john.carter@email.com</p>
        <p class="t-body t-muted confirm__contact confirm__contact--last">(555) 123-4567</p>
        <button type="button" class="btn btn--primary" data-confirm-me>Yes, that's me</button>
        <a class="btn btn--ghost confirm__alt" href="tel:+15551234567" data-not-me>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="22" height="22" aria-hidden="true"><path d="M6.5 3.5h3l1.5 4.5-2 1.5a12 12 0 0 0 5 5l1.5-2 4.5 1.5v3a2 2 0 0 1-2 2C11.5 19.5 4.5 12.5 4.5 5.5a2 2 0 0 1 2-2Z"/></svg>
          Not me — call the office
        </a>
      </section>

      <!-- confirmed state, swapped in after "Yes, that's me" -->
      <section class="card confirmed" id="confirmedCard" hidden aria-label="Details confirmed">
        <span class="confirmed__tick" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M4.5 12.5 9.5 17.5 19.5 6.5"/></svg>
        </span>
        <span class="confirmed__body">
          <strong>John Carter</strong>
          <span class="t-caption t-muted">Details confirmed</span>
        </span>
      </section>

      <p class="sr-only" role="status" aria-live="polite" data-onb-status></p>

      <!-- Everything after the confirmation. Hidden until then. -->
      <div id="onbRest" hidden>

      <!-- One question after the confirmation: which companion.
           Text size, notification channel and reminder time all still exist,
           in Settings. They were four more screens between a patient in their
           seventies and the app they came to use.

           NOTE for build: FSD §9.4 says the channel is chosen AT ONBOARDING.
           The client asked for this shortcut on 19 Aug; the control itself is
           unchanged in Settings, so only the timing differs from the spec. -->
      <section class="card rise rise-2" aria-label="Choose your companion">
        <h2 class="card__title" id="onbRestHead" tabindex="-1">Who's keeping you company?</h2>
        <p class="t-body t-muted mb-4">Your companion grows as your streak grows. You can change it any time in Settings.</p>
        <div class="companionpick" role="radiogroup" aria-label="Choose your companion">
          <button type="button" class="companionpick__opt" role="radio" aria-checked="true" data-companion-pick="plant">
            <img src="../assets/art/plant-2-mature.svg" alt="" aria-hidden="true" width="72" height="72">
            <span>Plant</span>
          </button>
          <button type="button" class="companionpick__opt" role="radio" aria-checked="false" data-companion-pick="cat">
            <img src="../assets/art/cat-2-young.svg" alt="" aria-hidden="true" width="72" height="72">
            <span>Cat</span>
          </button>
        </div>
      </section>

      <a class="btn btn--primary btn--sticky rise rise-3" href="../app/today.html">Start using Kivie</a>

      </div><!-- /#onbRest -->

    </main>
  </div>

  <script src="../js/app.js"></script>
  <script>
    /* R1 — confirm identity first, then reveal the one remaining question.
       One page, no route change, no back-stack for a 60–85 audience. */
    (function () {
      var confirmCard   = document.getElementById("confirmCard");
      var confirmedCard = document.getElementById("confirmedCard");
      var rest          = document.getElementById("onbRest");
      var yes           = document.querySelector("[data-confirm-me]");
      if (!yes) return;

      yes.addEventListener("click", function () {
        confirmCard.hidden = true;
        confirmedCard.hidden = false;
        rest.hidden = false;
        /* announce the change briefly — NOT via aria-live on the whole
           container, which would read the revealed section aloud */
        var status = document.querySelector("[data-onb-status]");
        if (status) status.textContent = "Details confirmed. One last choice below.";
        var head = document.getElementById("onbRestHead");
        if (head) head.focus();
      });
    })();
  </script>
<script>
  /* S16 — register the service worker so the app is genuinely installable
     (FSD §5.2, M1 §4). Silently ignored on browsers without support. */
  if ("serviceWorker" in navigator) {
    window.addEventListener("load", function () {
      navigator.serviceWorker.register("../sw.js", { scope: "../" }).catch(function () {});
    });
  }
</script>
</body>
</html>
